    { path = "proptest::test_runner::TestCaseError::reject", reason = "rejected cases count toward a run-wide limit, so some case count fails; construct inputs that satisfy the precondition" },
    { path = "proptest::test_runner::TestCaseError::Reject", reason = "rejected cases count toward a run-wide limit, so some case count fails; construct inputs that satisfy the precondition" },
