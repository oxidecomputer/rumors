[workspace]
members = [
    "crates/alloc-meter",
    "crates/before",
    "crates/before-fuelscape",
    "crates/before-viz",
    "crates/before/board-fuel/guest",
    "crates/before/board-fuel/harness",
    "crates/before/focused-fuel/guest",
    "crates/before/focused-fuel/harness",
    "crates/before/focused-fuel/protocol",
    "crates/before/fuzzfit/guest",
    "crates/before/fuzzfit/harness",
    "crates/before/surfacecheck",
    "crates/before/wasm32-pins/guest",
    "crates/before/wasm32-pins/harness",
    "crates/before/wasm32-pins/protocol",
    "crates/rumors-budget-curves",
    "crates/rumors-netperf",
    "crates/rumors-tracing",
    "crates/rumors-testkit",
    "crates/suanpan",
    "crates/suanpan/fuel/guest",
    "crates/suanpan/fuel/harness",
    "crates/suanpan/fuel/protocol",
]
# Every member shares this manifest's Cargo.lock, so the production crates
# and the tool-side instruments always resolve one version of each shared
# dependency. The cargo-fuzz workspace (`crates/before/fuzz`) stays
# detached, because it builds only with nightly and libFuzzer.
#
# The default members are the production crates and their test support,
# and the one list of them; every other member is a tool-side instrument
# that pulls in tooling the production crates never need, Wasmtime above
# all, and is reached through its own justfile recipes. A cargo command at
# the root with no package selection acts on the default members, so
# neither plain cargo nor the justfile's workspace-wide recipes compile
# Wasmtime. A bare `--workspace` reaches every member and compiles the
# tools, but `.config/nextest.toml`'s default filter keeps their tests out
# of a nextest run. `manifestlint` holds this list and that filter to the
# rules its header states.
default-members = [
    ".",
    "crates/alloc-meter",
    "crates/before",
    "crates/before-viz",
    "crates/rumors-tracing",
    "crates/rumors-testkit",
    "crates/suanpan",
]

# Every member inherits its license from here with `license.workspace =
# true`, and the publishable crates inherit their repository with
# `repository.workspace = true`. A detached package, which is its own
# workspace, cannot inherit from this table, so its manifest states the same
# license expression itself. `manifestlint` holds every member and every
# detached package to this expression.
[workspace.package]
license = "MPL-2.0"
repository = "https://github.com/oxidecomputer/rumors"

[workspace.dependencies]
alloc-meter = { path = "crates/alloc-meter" }
aes-gcm = { version = "0.11", default-features = false }
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.8.9", default-features = false }
# The visualizer encodes through the scalar URL-safe engine alone, so the
# SIMD engines behind the default `simd-unsafe` feature stay uncompiled.
base64 = { version = "0.23", default-features = false, features = ["std"] }
# The publishable crates carry a version beside their path: cargo publish
# replaces the path with the version, and cargo refuses a version that the
# crate at the path does not satisfy, so the two cannot drift apart.
before = { path = "crates/before", version = "0.1.0" }
# A fixed-size bit array backs `ByteSet`, the protocol's set of radixes.
bitvec = { version = "1.1", default-features = false }
board-fuel-harness = { path = "crates/before/board-fuel/harness" }
sha2 = "0.11"
sha3 = "0.12"
borsh = "1"
bytes = "1"
# The wire-capture renderer behind `rumors`'s `test-internals` renders the
# snapshot suites' captured traffic through the released cbor-diag, which
# recurses on input-controlled nesting depth; the renderer runs only on the
# suites' own traffic, and its module docs state the depth bound it holds.
# Pinned exact because the rendering is the snapshots' byte pin: a new
# release that printed anything differently would move every snapshot.
cbor-diag = "=0.1.12"
# Oxide's fork of cbor-diag, for `rumors-tracing`, which renders traffic
# from the network: nesting depth is bounded by default in every
# input-driven parse and print, so wire-derived bytes can be rendered
# without a guard in front. A git dependency, so `rumors-tracing` cannot be
# published until the fork is.
cbor-diag-bounded = { package = "cbor-diag", git = "https://github.com/oxidecomputer/cbor-diag-rs", rev = "a6a713671f92526b921bc926173266257379d609" }
# Depth admission and wire ingress run the same compiled deserializer, so
# decode-recursion accounting is symmetric within a binary, and across a
# mixed-version fleet it holds only if every build shares one accounting.
ciborium = "=0.2.2"
clap = "4"
console_error_panic_hook = "0.1"
criterion = "0.8"
csv = "1"
dirs = "7"
dlmalloc = "0.2"
dsi-bitstream = { version = "0.10.1", default-features = false, features = ["alloc"] }
flate2 = "1"
focused-fuel-protocol = { path = "crates/before/focused-fuel/protocol" }
# 0.11.0 does not build on illumos: it combines `libc`'s `POSIX_SPAWN_*`
# flags, `i16` there, into a `c_int`.
fork = "0.10"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
fuzzfit-harness = { path = "crates/before/fuzzfit/harness" }
hex = "0.4"
hkdf = "0.13"
hmac = "0.13"
# HPKE (RFC 9180), rozbb/rust-hpke on RustCrypto's `p256`, `hkdf` and
# `aes-gcm`: the bootstrap's sealed exchange.
hpke = { version = "0.15", default-features = false }
http = "1"
indicatif = "0.18"
insta = "1.49"
itertools = "0.15"
libm = "0.2"
mimalloc = "0.1"
nix = { version = "0.31", default-features = false }
num-bigint = "0.5"
num-traits = "0.2"
nutype = { version = "0.8", features = ["serde"] }
peak_alloc = "0.3"
plotters = { version = "0.3", default-features = false }
# 1.0's `block_on` keeps a wakeup only in its thread's park token, so a
# future that parks its own thread while polled (`std::thread::scope` does,
# to wait for its threads) can consume the wakeup and leave `block_on`
# parked for good; the peer suite's redaction race does this. 0.4 keeps the
# wakeup in its own state.
pollster = { version = "0.4", features = ["macro"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
proptest = "1.12"
rand = "0.10"
redb = "4.5"
rand08 = { package = "rand", version = "0.8" }
rand_chacha = "0.10"
rand_chacha03 = { package = "rand_chacha", version = "0.3" }
rand_distr = "0.6"
rayon = "1"
# A self-signed certificate for the TLS sessions of the TLS record suite
# and the link-measurement tool, generated per run, so no key is ever
# committed.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rumors = { path = "." }
rumors-testkit = { path = "crates/rumors-testkit" }
rustc_version = "0.4"
# The official rustdoc JSON schema crate. Pinned exact because the crate
# version is the format pin: rustdoc-types 0.59.0 speaks format_version 59,
# and surfacecheck refuses any document whose format_version differs from
# `rustdoc_types::FORMAT_VERSION`.
rustdoc-types = "=0.59.0"
# TLS for the TLS record suite and the link-measurement tool, on the
# `ring` provider, which builds with a C compiler alone on every host they
# run on.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
schnellru = { version = "0.2.4", default-features = false }
seq-macro = "0.3"
serde = { version = "1", default-features = false }
serde_bytes = "0.11"
serde_json = "1"
serde_test = "1"
smallvec = { version = "1.16", features = ["union"] }
spin = { version = "0.12", default-features = false, features = ["spin_mutex"] }
static_assertions = "1.1"
strum_macros = "0.28.0"
# Versioned beside its path for publishing; see `before` above.
suanpan = { path = "crates/suanpan", version = "0.1.0" }
suanpan-fuel-protocol = { path = "crates/suanpan/fuel/protocol" }
tempfile = "3.27"
thiserror = "2"
tinyvec = { version = "1.13", features = ["alloc"] }
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "1"
tracing = "0.1"
# The link-measurement tool's readable source revision, from the git
# command line, which every host that builds from a checkout already has.
vergen-gitcl = "10"
wasm-bindgen = "0.2"
wasm32-pins-protocol = { path = "crates/before/wasm32-pins/protocol" }
wasmtime = { version = "50.0.1", default-features = false }
zeroize = "1.9"

[package]
name = "rumors"
version = "0.1.0"
edition = "2024"
description = "Lightspeed causal gossip."
license.workspace = true
repository.workspace = true
readme = "README.md"
# The package carries the library alone. The test suites, benches and
# examples build on `rumors-testkit`, which is never published, and the
# formal models, tools and CI configuration verify this repository rather
# than the crate.
include = ["/src/**", "/README.md", "/LICENSE*"]

# docs.rs renders the feature-gated surface the crate advertises
# (`conformance`, `fs`) and nothing of `test-internals`, whose introspection
# and scheduling hooks exist for this crate's own tests and which no
# application enables. The `docsrs` cfg turns on lib.rs's `doc_cfg` feature,
# so gated items label their gate; the justfile's `docs-docsrs` leg builds
# this configuration.
[package.metadata.docs.rs]
features = ["conformance", "fs"]
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"

[lib]
bench = false

[features]
# Test-only introspection and deterministic scheduling infrastructure.
# Enabled for this crate's own tests via the self-referential dev-dependency
# below; never enable it in an application.
test-internals = ["tokio/rt", "dep:cbor-diag", "dep:proptest", "dep:rand_chacha"]
# A conformance suite for caller-built bookmark storage. Enable from a
# dev-dependency to validate an application's storage adapter.
conformance = []
# Atomic file storage for bookmarks, driven by a caller-supplied blocking
# executor. Tokio's `rt` provides the blocking pool behind `TokioBlocking`.
fs = ["dep:redb", "tokio/rt"]

[dependencies]
before = { workspace = true, features = ["serde"] }
bitvec.workspace = true
bytes.workspace = true
# The `zeroize` features clear the network secret's HMAC key state, and
# the SHA-256 cores inside it, when a path key drops.
sha2 = { workspace = true, features = ["zeroize"] }
hmac = { workspace = true, features = ["zeroize"] }
sha3.workspace = true
zeroize.workspace = true
# The bootstrap's sealed secret: HPKE base mode with DHKEM(P-256,
# HKDF-SHA256), HKDF-SHA256 and AES-256-GCM, drawing its keys from the
# operating system.
hpke = { workspace = true, features = ["nistp", "aes", "getrandom"] }
# Not used directly: `hpke` builds `aes-gcm` without its `zeroize` feature,
# and enabling it here makes the AES key schedule inside each HPKE
# context clear when the context drops.
aes-gcm = { workspace = true, features = ["zeroize"] }
# The network secret's key schedule (`NetworkKeys`).
hkdf.workspace = true
itertools.workspace = true
serde = { workspace = true, default-features = true, features = ["derive"] }
ciborium.workspace = true
seq-macro.workspace = true
smallvec.workspace = true
tinyvec.workspace = true
thiserror.workspace = true
# `Display` for enums that label parts of a frame or reply but describe no
# failure, so they are not errors.
strum_macros.workspace = true
hex.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "sync"] }
futures.workspace = true
async-stream.workspace = true
rand.workspace = true
schnellru.workspace = true
# The `fs` feature's `FileBookmark`: one crash-safe file per bookmark, locked
# for the bookmark's lifetime.
redb = { workspace = true, optional = true }
# The wire-capture renderer behind `test-internals` renders every captured
# item in diagnostic notation through this crate.
cbor-diag = { workspace = true, optional = true }
# The property-test support behind `test-internals` (`testing::property`)
# draws each test network's seed as a proptest input and derives the
# network's secret from a ChaCha stream, whose output for a seed is fixed
# across platforms and Rand versions.
proptest = { workspace = true, optional = true }
rand_chacha = { workspace = true, optional = true }

[dev-dependencies]
# The kv example persists its peer identity through `FileBookmark`.
rumors = { path = ".", features = ["test-internals", "conformance", "fs"] }
rumors-testkit.workspace = true
# The meter feature lights before's instrument surface for this crate's
# own tests: the conservation suite reads the exact-bit-length observation
# (`encoded_bits`) it denominates identity conservation in.
before = { workspace = true, features = ["serde", "meter"] }
proptest.workspace = true
criterion = { workspace = true, features = ["html_reports"] }
insta.workspace = true
# The suites use `Bytes` as a payload type, which must serialize.
bytes = { workspace = true, features = ["serde"] }
tokio = { workspace = true, features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "io-util",
    "net",
    "time",
    # Paused-clock runtimes: the latency benchmarks charge simulated wire
    # delay to virtual time so sweeps cost wall-clock compute only.
    "test-util",
    # The kv example retires its peer on Ctrl-C.
    "signal",
] }
rand.workspace = true
# Deterministic tests and benchmarks use ChaCha: its output is fixed across
# platforms and Rand versions, so a committed seed continues to name one corpus.
rand_chacha.workspace = true
pollster.workspace = true
# The allocation-pricing suites read per-thread allocator traffic from it.
alloc-meter.workspace = true
# The seed-after-fork regression test forks its process, through a crate
# rather than `unsafe` calls of its own.
fork.workspace = true
# The sealed exchange's tests seal and open through `hpke` directly, as an
# oracle for the documented bindings, with its allocating API.
hpke = { workspace = true, features = ["alloc"] }
# The TLS record suite runs sessions over TLS 1.3 to check that the
# default write batch fits each record in one TCP segment. The kv example
# creates its self-signed network credentials and writes them as PEM.
rcgen = { workspace = true, features = ["pem"] }
rustls.workspace = true
tokio-rustls.workspace = true
# The kv example's command-line interface, its error reporting, and its
# cancellation and task tracking.
clap = { workspace = true, features = ["derive"] }
anyhow.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
# The kv example's HTTP interface: plain-text and JSON reads, and form-encoded
# writes, served over HTTP/1.
axum = { workspace = true, features = ["tokio", "http1", "json", "form"] }
# The kv example parses peer addresses as `host[:port]` authorities, resolved
# when it dials.
http.workspace = true
# The kv example's keys and values: non-empty strings, checked when parsed.
nutype.workspace = true
# The kv example publishes its credentials file atomically, without
# overwriting one that a concurrently starting node already published.
tempfile.workspace = true

[profile.dev]
debug = "line-tables-only"

# The test suite spends most of its time inside these two crates' kernels
# (the skyline walks and the bignum arithmetic), so optimizing them cuts
# test execution while leaving every other crate's compile untouched.
# `debug-assertions` stays on, as the dev profile grants, so the tests run
# the `debug_assert!` checks that `--release` would remove.
[profile.dev.package.before]
opt-level = 2

[profile.dev.package.suanpan]
opt-level = 2

# The session-budget suite's 100,000-message sessions spend about half their
# time in this crate's own code, which runs several times slower
# unoptimized: optimizing it takes each of those tests from about 120 s to
# about 41 s, against the gate's 300 s per-test limit. The cost is compile
# time: the crate's unit-test binary compiles in about 300 s from cold
# rather than 117 s. `debug-assertions` and overflow checks stay on, as for
# `before` and `suanpan`. The session futures' sizes, which
# `tests/future_size.rs` and the gossip session-size test check, are the
# same at opt-level 0 and 1.
[profile.dev.package.rumors]
opt-level = 1

# The session-budget suite classifies tens of millions of traced allocator
# events in the meter's lifetime analysis, which dominates its execution
# unoptimized.
[profile.dev.package.alloc-meter]
opt-level = 2

# Leaf paths and node hashes are SHA-256, which every test that builds a
# tree computes many times; bookmark checksums and the test fixtures'
# fingerprints are SHA3-256. On x86_64, keccak computes SHA3 in software,
# and unoptimized that costs about 54 µs a hash. Optimizing the hash crates
# keeps hashing at release speed in the test suite without touching
# release.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.keccak]
opt-level = 3

[profile.dev.package.sha3]
opt-level = 3

# The fuel guests' profile (the fuzz-fit guest's and the fuel board's), part
# of what fuel measures: fuel counts the instructions of this codegen. One
# codegen unit keeps function layout independent of build parallelism, and it
# must reach every crate compiled into each guest, `before` and its
# dependencies included. A per-package override cannot confine that to the
# guest, since it applies to the crates it names in every release build; a
# profile of its own leaves `release` unchanged for every other build.
[profile.fuel]
inherits = "release"
codegen-units = 1
panic = "abort"

# The 32-bit boundary-pin guest's profile: `release`, with overflow checks
# stated off rather than inherited, so the guest runs the arithmetic users
# get in an ordinary release build. Explicit boundary checks in the code
# under test must prevent a 32-bit wrap; a compiler-added overflow trap
# would conceal the wrong-value failures the pins exist to catch.
[profile.wasm32-pins]
inherits = "release"
overflow-checks = false

# The release-profile test run's profile: `release` codegen, so properties
# run at CI's case count in reasonable time, with the runtime checks the dev
# profile grants. Overflow traps and `debug_assert!`s then run in every
# release-profile test run, not only in the gate's dev-profile `test-all`,
# so arithmetic that wraps silently in release fails a test instead.
[profile.release-checked]
inherits = "release"
overflow-checks = true
debug-assertions = true

# Profiling the benches needs symbolicated stacks; line tables are enough
# for samply/Instruments without the compile-time cost of full debug info.
[profile.bench]
debug = "line-tables-only"

[[bench]]
name = "branch_hash"
harness = false

[[bench]]
name = "in_memory"
harness = false

[[bench]]
name = "gossip_grid"
harness = false

[[bench]]
name = "gossip_fixed"
harness = false
