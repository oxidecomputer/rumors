[workspace]
members = [
    "crates/alloc-meter",
    "crates/before",
    "crates/before-fuelscape",
    "crates/before-viz",
    "crates/before/board-fuel/guest",
    "crates/before/board-fuel/harness",
    "crates/before/focused-fuel/guest",
    "crates/before/focused-fuel/harness",
    "crates/before/focused-fuel/protocol",
    "crates/before/fuzzfit/guest",
    "crates/before/fuzzfit/harness",
    "crates/before/surfacecheck",
    "crates/before/wasm32-pins/guest",
    "crates/before/wasm32-pins/harness",
    "crates/before/wasm32-pins/protocol",
    "crates/rumors-tracing",
    "crates/rumors-testkit",
    "crates/suanpan",
    "crates/suanpan/fuel/guest",
    "crates/suanpan/fuel/harness",
    "crates/suanpan/fuel/protocol",
]
# Every member shares this manifest's Cargo.lock, so the production crates
# and the tool-side instruments always resolve one version of each shared
# dependency. The cargo-fuzz workspace (`crates/before/fuzz`) stays
# detached, because it builds only with nightly and libFuzzer.
#
# The default members are the production crates and their test support,
# and the one list of them; every other member is a tool-side instrument
# that pulls in tooling the production crates never need, Wasmtime above
# all, and is reached through its own justfile recipes. A cargo command at
# the root with no package selection acts on the default members, so
# neither plain cargo nor the justfile's workspace-wide recipes compile
# Wasmtime. A bare `--workspace` reaches every member and compiles the
# tools, but `.config/nextest.toml`'s default filter keeps their tests out
# of a nextest run. `manifestlint` holds this list and that filter to the
# rules its header states.
default-members = [
    ".",
    "crates/alloc-meter",
    "crates/before",
    "crates/before-viz",
    "crates/rumors-tracing",
    "crates/rumors-testkit",
    "crates/suanpan",
]

[workspace.dependencies]
alloc-meter = { path = "crates/alloc-meter" }
async-stream = "0.3"
base64 = "0.22"
before = { path = "crates/before" }
board-fuel-harness = { path = "crates/before/board-fuel/harness" }
sha3 = "0.12"
borsh = "1"
bytes = "1"
# Oxide's fork of cbor-diag: nesting depth is bounded by default in every
# input-driven parse and print (upstream recurses on input-controlled
# depth), so wire-derived bytes can be rendered without a guard in front.
cbor-diag = { git = "https://github.com/oxidecomputer/cbor-diag-rs", rev = "a6a713671f92526b921bc926173266257379d609" }
# Depth admission and wire ingress run the same compiled deserializer, so
# decode-recursion accounting is symmetric within a binary, and across a
# mixed-version fleet it holds only if every build shares one accounting.
ciborium = "=0.2.2"
clap = "4"
console_error_panic_hook = "0.1"
criterion = "0.5"
dlmalloc = "0.2"
dsi-bitstream = { version = "0.10.1", default-features = false, features = ["alloc"] }
flate2 = "1"
focused-fuel-protocol = { path = "crates/before/focused-fuel/protocol" }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
fuzzfit-harness = { path = "crates/before/fuzzfit/harness" }
hex = "0.4"
indicatif = "0.18"
insta = "1.47"
itertools = "0.14"
libm = "0.2"
mimalloc = "0.1"
num-bigint = "0.4"
num-traits = "0.2"
peak_alloc = "0.3"
plotters = { version = "0.3", default-features = false }
pollster = { version = "0.4", features = ["macro"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
proptest = "1"
rand = "0.9"
rand08 = { package = "rand", version = "0.8" }
rand_chacha = "0.9"
rand_chacha03 = { package = "rand_chacha", version = "0.3" }
rayon = "1"
rumors = { path = "." }
rumors-testkit = { path = "crates/rumors-testkit" }
rustc_version = "0.4"
# The official rustdoc JSON schema crate. Pinned exact because the crate
# version is the format pin: rustdoc-types 0.59.0 speaks format_version 59,
# and surfacecheck refuses any document whose format_version differs from
# `rustdoc_types::FORMAT_VERSION`.
rustdoc-types = "=0.59.0"
schnellru = { version = "0.2.4", default-features = false }
seq-macro = "0.3"
serde = { version = "1", default-features = false }
serde_bytes = "0.11"
serde_json = "1"
serde_test = "1"
smallvec = { version = "1.15", features = ["union"] }
spin = { version = "0.12", default-features = false, features = ["spin_mutex"] }
static_assertions = "1.1"
strum_macros = "0.28.0"
suanpan = { path = "crates/suanpan" }
suanpan-fuel-protocol = { path = "crates/suanpan/fuel/protocol" }
tempfile = "=3.23.0"
thiserror = "2"
tinyvec = { version = "1.11", features = ["alloc"] }
tokio = { version = "1", default-features = false }
tracing = "0.1"
wasm-bindgen = "0.2"
wasm32-pins-protocol = { path = "crates/before/wasm32-pins/protocol" }
wasmtime = { version = "48.0.7", default-features = false }

[package]
name = "rumors"
version = "0.1.0"
edition = "2024"
readme = "README.md"

# docs.rs renders every feature-gated module the crate docs advertise
# (`conformance`), matching the gate's all-features rustdoc passes. The
# `docsrs` cfg turns on lib.rs's `doc_cfg` feature, so gated items label
# their gate; the justfile's `docs-docsrs` leg builds this configuration.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"

[lib]
bench = false

[features]
# Test-only introspection and deterministic scheduling infrastructure.
# Enabled for this crate's own tests via the self-referential dev-dependency
# below; never enable it in an application.
test-internals = ["tokio/rt", "dep:cbor-diag"]
# Conformance suites for caller-built links and bookmark storage.
# Enable from a dev-dependency to validate an application's adapters.
conformance = []
# Atomic file storage for bookmarks, driven by caller-supplied blocking execution.
fs = ["dep:tempfile"]

[dependencies]
before = { workspace = true, features = ["serde"] }
bytes.workspace = true
sha3.workspace = true
itertools.workspace = true
serde = { workspace = true, default-features = true, features = ["derive"] }
ciborium.workspace = true
seq-macro.workspace = true
smallvec.workspace = true
tinyvec.workspace = true
thiserror.workspace = true
hex.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "sync"] }
futures.workspace = true
async-stream.workspace = true
rand.workspace = true
schnellru.workspace = true
tempfile = { workspace = true, optional = true }
# The wire-capture renderer behind `test-internals` renders every captured
# item in diagnostic notation through this crate.
cbor-diag = { workspace = true, optional = true }

[dev-dependencies]
rumors = { workspace = true, features = ["test-internals", "conformance"] }
rumors-testkit.workspace = true
# The meter feature lights before's instrument surface for this crate's
# own tests: the conservation suite reads the exact-bit-length observation
# (`encoded_bits`) it denominates identity conservation in.
before = { workspace = true, features = ["serde", "meter"] }
proptest.workspace = true
criterion = { workspace = true, features = ["html_reports"] }
insta.workspace = true
# The suites use `Bytes` as a payload type, which must serialize.
bytes = { workspace = true, features = ["serde"] }
tokio = { workspace = true, features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "io-util",
    "net",
    "time",
    # Paused-clock runtimes: the latency benchmarks charge simulated wire
    # delay to virtual time so sweeps cost wall-clock compute only.
    "test-util",
] }
rand.workspace = true
# Deterministic tests and benchmarks use ChaCha: its output is fixed across
# platforms and Rand versions, so a committed seed continues to name one corpus.
rand_chacha.workspace = true
pollster.workspace = true
# The allocation-pricing suites read per-thread allocator traffic from it.
alloc-meter.workspace = true

[profile.dev]
debug = "line-tables-only"

# The test suite spends most of its time inside these two crates' kernels
# (the skyline walks and the bignum arithmetic), so optimizing them cuts
# test execution while leaving every other crate's compile untouched.
# `debug-assertions` stays on, as the dev profile grants, so the tests run
# the `debug_assert!` checks that `--release` would remove.
[profile.dev.package.before]
opt-level = 2

[profile.dev.package.suanpan]
opt-level = 2

# The fuel guests' profile (the fuzz-fit guest's and the fuel board's), part
# of what fuel measures: fuel counts the instructions of this codegen. One
# codegen unit keeps function layout independent of build parallelism, and it
# must reach every crate compiled into each guest, `before` and its
# dependencies included. A per-package override cannot confine that to the
# guest, since it applies to the crates it names in every release build; a
# profile of its own leaves `release` unchanged for every other build.
[profile.fuel]
inherits = "release"
codegen-units = 1
panic = "abort"

# The 32-bit boundary-pin guest's profile: `release`, with overflow checks
# stated off rather than inherited, so the guest runs the arithmetic users
# get in an ordinary release build. Explicit boundary checks in the code
# under test must prevent a 32-bit wrap; a compiler-added overflow trap
# would conceal the wrong-value failures the pins exist to catch.
[profile.wasm32-pins]
inherits = "release"
overflow-checks = false

# Profiling the benches needs symbolicated stacks; line tables are enough
# for samply/Instruments without the compile-time cost of full debug info.
[profile.bench]
debug = "line-tables-only"

[[bench]]
name = "branch_hash"
harness = false

[[bench]]
name = "in_memory"
harness = false

[[bench]]
name = "gossip_grid"
harness = false

[[bench]]
name = "gossip_fixed"
harness = false

[[bench]]
name = "window_wallclock"
harness = false
