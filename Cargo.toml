[workspace]
members = [
    "crates/before",
    "crates/before-viz",
    "crates/surface-scan",
    "crates/suanpan",
]

# The version of record for every dependency in the workspace: member
# manifests inherit an entry with `workspace = true`, adding only their own
# feature selections and `optional` flags (which cargo requires at the
# member). No member declares a version, path, or default-features choice of
# its own.
[workspace.dependencies]
arc-swap = "1"
async-stream = "0.3"
base64 = "0.22"
before = { path = "crates/before" }
bitvec = "1"
blake3 = "1.8"
borsh = "1"
bytes = "1"
# Pinned exactly: depth admission and wire ingress run the same compiled
# deserializer, so decode-recursion accounting is symmetric within a binary,
# and across a mixed-version fleet it holds only if every build shares one
# accounting — which this exact pin provides, since ciborium documents no
# accounting contract. Bumping is a deliberate, fleet-coordinated event: run
# a two-build accept/reject verdict differential over a seeded corpus at the
# old and candidate versions; identical verdicts make a pure bump; differing
# verdicts ship with a greeting accounting stamp so mixed fleets fail fast at
# the handshake; and a verdict-strictening bump additionally requires
# re-validating stored payloads before gossiping.
ciborium = "=0.2.2"
clap = { version = "4", features = ["derive"] }
console_error_panic_hook = "0.1"
criterion = "0.5"
dashu-int = { version = "0.5", default-features = false, features = ["std"] }
dsi-bitstream = { version = "0.10.1", default-features = false, features = ["alloc"] }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
indicatif = "0.18"
insta = "1.47"
itertools = "0.14"
peak_alloc = "0.3"
pollster = { version = "0.4", features = ["macro"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
proptest = "1"
rand = "0.8"
rand_chacha = "0.3"
ratatui = "0.30"
rayon = "1"
rumors = { path = "." }
seq-macro = "0.3"
serde = { version = "1", default-features = false }
serde_json = "1"
smallvec = { version = "1.15", features = ["union"] }
stacker = "0.1"
static_assertions = "1.1"
stats_alloc = "0.1"
suanpan = { path = "crates/suanpan" }
surface-scan = { path = "crates/surface-scan" }
thiserror = "2"
tinyvec = { version = "1.11", features = ["alloc"] }
tokio = { version = "1", default-features = false }
tokio-stream = "0.1"
wasm-bindgen = "0.2"

[package]
name = "rumors"
version = "0.1.0"
edition = "2024"
readme = "README.md"

# docs.rs renders every feature-gated module the crate docs advertise
# (`conformance`), matching the gate's all-features rustdoc passes. The
# `docsrs` cfg turns on lib.rs's `doc_auto_cfg`, so gated items self-label.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
# Keep `cargo bench` from compiling the library itself as a libtest bench
# harness. That auto-target rebuilds the whole crate — every `#[cfg(test)]`
# module included — at opt-level 3 in a single rustc invocation, and its
# codegen peak is the heaviest compile in the workspace (it trips the
# memwatch per-process ceiling). The harness would run nothing: stable Rust
# has no bench items, and every real benchmark is a `harness = false`
# criterion target below. The test modules keep their coverage through the
# dev-profile test runs; `cargo bench` still builds this library once, as
# the ordinary rlib the criterion targets link against.
bench = false

[features]
# Test-only introspection and deterministic scheduling infrastructure.
# Enabled for this crate's own tests via the self-referential dev-dependency
# below; never enable it in an application.
test-internals = ["tokio/rt"]
# The public conformance suite for caller-built `Link` implementations:
# enable from a dev-dependency to validate a custom transport against the
# link contract. Documented; safe (though pointless) in an application.
conformance = []
# Lights `before`'s deterministic resource counters for this crate's own
# metering tests (the branch bound memos' fold-cost comparison). Test-only
# and off by default, in `before`'s limb-meter idiom: the counters add an
# atomic bump per operation, so they stay out of the default test and
# bench builds and are lit by `--all-features` runs (the gate's test-all).
meter = ["before/limb-meter", "before/scan-meter"]

[dependencies]
before = { workspace = true, features = ["serde"] }
bytes = { workspace = true, features = ["serde"] }
blake3 = { workspace = true }
static_assertions = { workspace = true }
itertools = { workspace = true }
serde = { workspace = true, default-features = true, features = ["derive"] }
ciborium = { workspace = true }
seq-macro = { workspace = true }
smallvec = { workspace = true }
tinyvec = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "sync"] }
tokio-stream = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
async-stream = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
rumors = { workspace = true, features = ["test-internals", "conformance"] }
# The meter feature lights before's instrument surface for this crate's
# own tests: the conservation suite reads the exact-bit-length observation
# (`encoded_bits`) it denominates identity conservation in.
before = { workspace = true, features = ["serde", "meter"] }
proptest = { workspace = true }
criterion = { workspace = true, features = ["html_reports"] }
insta = { workspace = true }
tokio = { workspace = true, default-features = true, features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "io-util",
    "net",
    "time",
    # Paused-clock runtimes: the latency benchmarks charge simulated wire
    # delay to virtual time so sweeps cost wall-clock compute only.
    "test-util",
] }
clap = { workspace = true }
rand = { workspace = true, features = ["small_rng"] }
arc-swap = { workspace = true }
pollster = { workspace = true }
ratatui = { workspace = true }
# Counting global allocator for the decoder allocation meter
# (`tests/decode_alloc.rs`): prices decodes in bytes requested from the
# allocator, so a declared-length pre-allocation is observable.
stats_alloc = { workspace = true }

[profile.dev]
debug = "line-tables-only"

# The test suite spends most of its time inside these two crates' kernels
# (the skyline walks and the bignum arithmetic), so optimizing them cuts
# test execution while leaving every other crate's compile untouched.
# `debug-assertions` stays on, as the dev profile grants: the envelope
# suite's limb, scan, and touch pins count work the `debug_assert!`
# comparisons perform, and those are what `--release` would remove.
[profile.dev.package.before]
opt-level = 2

[profile.dev.package.suanpan]
opt-level = 2

# Profiling the benches needs symbolicated stacks; line tables are enough
# for samply/Instruments without the compile-time cost of full debug info.
[profile.bench]
debug = "line-tables-only"

[[example]]
name = "swarm"
path = "examples/swarm.rs"
# The steady-state controller's convergence tests live in the example.
test = true

[[bench]]
name = "branch_hash"
harness = false

[[bench]]
name = "in_memory"
harness = false

[[bench]]
name = "gossip_grid"
harness = false

[[bench]]
name = "gossip_fixed"
harness = false

[[bench]]
name = "window_wallclock"
harness = false
