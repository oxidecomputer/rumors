# The smoke grid: the reference grid's structure at its smallest, run once,
# to show on your Linux host that every path a reference run takes works
# before you spend hours on one. It measures nothing worth publishing;
# `rumors-netperf check` judges whether it ran cleanly.
#
# It touches each of the reference run's paths at least once:
#
# - every group of `grids/reference.toml`, each at one of its smallest
#   points;
# - every way to spell a budget: `0`, a byte count (`128MiB`), `default`,
#   and `unlimited`;
# - the wire-time skip: the diagonal group's `max_wire_seconds` is lowered
#   so that its disjoint pairs at 10 Mbit/s are skipped and recorded as
#   skipped;
# - the rerun with raised TCP limits: the fresh-connection group's link,
#   1 Gbit/s at a 250 ms round trip, could keep about 31 MB in flight,
#   and its pair sends far more than the window Linux's default limits
#   allow (4 MiB of send buffer, half of it payload), so the run reruns
#   it with the limits raised;
# - the reference grid's heaviest pair, a million messages on each side
#   with none shared, at the unlimited budget on an uncapped link: the
#   reference run's heaviest session;
# - calibration, which each shard runs before its sessions;
# - a fresh connection, beside a warm one on the same link;
# - TLS 1.3, the transport every session of both grids runs over, since
#   neither sets the `tls` axis and the tool's default is `on`.
#
# Run it in two shards, as a reference run split across hosts would be,
# then check both shards together, which also renders their merged report
# (into smoke-1/check):
#
#     rumors-netperf run --grid grids/smoke.toml --shard 1/2 --out smoke-1
#     rumors-netperf run --grid grids/smoke.toml --shard 2/2 --out smoke-2
#     rumors-netperf check smoke-1 smoke-2
#
# Each shard calibrates as a reference run does: it runs its heaviest pair
# alone several times, then 2, 4, 8, … copies at once until a level fails
# or the copies reach one per two processors.
# In the shard holding the million-message pair, the host must therefore
# hold that session's memory once for each copy at the highest level
# calibration reaches, as it must for the reference run.

repetitions = 1

[defaults]
size_mean = 100
size_cv = 0
rate = "1Gbit"
rtt = "1ms"

# Two replicas of 10,000 messages, disjoint and sharing 90%, and the
# reference grid's heaviest pair, two disjoint replicas of a million
# messages, at the unlimited budget. The other groups cover the other
# budget spellings.
[[group]]
name = "diagonal"
pairs = [
    { insert_a = 10000, insert_b = 10000 },
    { shared = 9000, insert_a = 1000, insert_b = 1000 },
    { insert_a = 1000000, insert_b = 1000000 },
]
rate = ["10Mbit", "uncapped"]
rtt = ["1ms"]
budget = ["unlimited"]
# The tool estimates the 10,000-message disjoint pair's busier direction at
# about 1.5 seconds on the wire at 10 Mbit/s, and the million-message pair's
# at far more, so this skips both there.
max_wire_seconds = 1

[[group]]
name = "one-sided"
pairs = [
    { shared = 100000, insert_a = 1000 },
]
rate = ["100Mbit"]
rtt = ["10ms"]
budget = ["128MiB"]
max_wire_seconds = 16

[[group]]
name = "join"
pairs = [
    { insert_a = 100000 },
]
rate = ["1Gbit"]
rtt = ["1ms"]
budget = ["0"]
max_wire_seconds = 16

[[group]]
name = "skewed and identical"
pairs = [
    { shared = 100000, insert_a = 10000, insert_b = 1000 },
    { shared = 100000 },
]
rate = ["100Mbit"]
rtt = ["1ms"]
budget = ["default"]
max_wire_seconds = 16

[[group]]
name = "redaction"
pairs = [
    { shared = 100000, insert_a = 1000, insert_b = 1000, redact_a = 1000, redact_b = 1000 },
]
rate = ["10Mbit"]
rtt = ["50ms"]
budget = ["0"]
max_wire_seconds = 16

[[group]]
name = "fresh connection"
pairs = [
    { insert_a = 100000, insert_b = 100000 },
]
rate = ["1Gbit"]
rtt = ["250ms"]
connection = ["fresh", "warm"]

[[group]]
name = "asymmetric link"
pairs = [
    { shared = 100000, insert_b = 1000 },
]
rate = ["100Mbit/10Mbit"]
rtt = ["10ms"]
