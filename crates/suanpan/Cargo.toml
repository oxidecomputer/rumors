[package]
name = "suanpan"
version = "0.1.0"
edition = "2021"
description = "Exact signed accumulation with bounded carry and cancellation work."
license = "MPL-2.0"
readme = "README.md"

[dev-dependencies]
proptest = { workspace = true }
num-bigint = { workspace = true }

[features]
# Counts arithmetic digit work and streamed operand reads in a process-global
# counter. Disabled by default; each recorded touch uses a relaxed atomic add.
touch-meter = []
