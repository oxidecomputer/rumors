[package]
name = "suanpan"
version = "0.1.0"
edition = "2021"
description = "Exact signed accumulation with bounded carry and cancellation work."
license.workspace = true
repository.workspace = true
readme = "README.md"
# The package carries the library alone; the fuel harnesses build on
# workspace crates that are never published.
include = ["/src/**", "/README.md", "/LICENSE*"]

# docs.rs renders the `num-bigint` conversions the crate docs advertise,
# which no default-feature build compiles; the justfile's `docs-docsrs` leg
# builds this configuration.
[package.metadata.docs.rs]
features = ["num-bigint"]

[dependencies]
num-bigint = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
num-bigint.workspace = true

[features]
# Converts to and from num-bigint's integers and accepts them as operands.
num-bigint = ["dep:num-bigint"]
