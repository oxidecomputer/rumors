[package]
name = "before-viz"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "WASM replay engine for the interactive Interval Tree Clocks visualizer."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
before = { workspace = true }
wasm-bindgen = { workspace = true }
serde = { workspace = true, default-features = true, features = ["derive"] }
serde_json = { workspace = true }
base64 = { workspace = true }
console_error_panic_hook = { workspace = true, optional = true }

[features]
default = ["console_error_panic_hook"]

[dev-dependencies]
proptest = { workspace = true }

# On release-profile builds wasm-pack otherwise downloads and executes a
# binaryen `wasm-opt` fetched unpinned from GitHub releases at build time,
# inside the Pages deploy's build job — and taiki-e's install-action
# carries no binaryen manifest to pin it with. A pinned-download script is
# not worth owning for a demo artifact, so the demo wasm ships unoptimized
# instead (larger by an estimated 10-25%: an unmeasured envelope from
# wasm-opt's typical shrink on wasm-bindgen output).
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
