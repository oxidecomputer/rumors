[package]
name = "before"
version = "0.1.0"
edition = "2021"
description = "Interval Tree Clocks (Almeida, Baquero & Fonte, 2008): packed bit-stream storage, transient fixed-width working form, linear-typed API."
license = "MPL-2.0"
readme = "README.md"

# docs.rs builds get the fuelscape widget assets injected into every
# page's head; the committed header file ships in the package, and
# build.rs holds it fresh against the stylesheet and script it derives
# from.
[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "docs/fuelscape-header.html"]

# build.rs is a pure formatter: it renders the committed fuelscape
# widget datasets (fuelscape/) into the doc islands the # Complexity
# sections include from $OUT_DIR. serde_json only reads the committed
# JSON; nothing is measured or computed at build time.
[build-dependencies]
serde_json = "1"

[dependencies]
bytes = "1"
dashu-int = { version = "0.5", default-features = false, features = ["std"] }
suanpan = { path = "../suanpan" }
dsi-bitstream = { version = "0.10.1", default-features = false, features = ["alloc"] }
static_assertions = "1.1"
thiserror = "2"
serde = { version = "1", optional = true, default-features = false, features = ["derive", "alloc"] }
borsh = { version = "1", optional = true }

[dev-dependencies]
# The emit_probe example's external comparison baseline: the production
# build buffer is the crate-owned BitsBuf, and nothing shipped links bitvec.
bitvec = "1"
proptest = "1"
serde_json = "1"
criterion = "0.5"
rand = "0.8"
rand_chacha = "0.3"
postcard = { version = "1", default-features = false, features = ["use-std"] }
ciborium = "0.2"
stacker = "0.1"
peak_alloc = "0.3"
insta = "1"
rayon = "1"
indicatif = "0.18"
before = { path = ".", features = ["oracle", "meter"] }
surface-scan = { path = "../surface-scan" }

[features]
default = []
serde = ["dep:serde"]
borsh = ["dep:borsh"]
# Re-exports the reference oracle (`src/oracle.rs`) as `before::oracle`, so the
# benchmark suite can time it against the optimized implementation.
# Bench/test-only.
oracle = []
# Exposes the adversarial input generators and deterministic resource meters
# (`src/meter.rs`) as `before::meter`, so the metering test binaries can build
# worst-case inputs and read the counters they envelope, and the public
# operation surface roster (`src/surface.rs`) as `before::surface`, so external
# instrument crates can bind their coverage to the rows the surface-coverage
# suite enforces totality over. Bench/test-only.
meter = []
# Exposes the named algebraic-law predicates (`src/laws.rs`) as `before::laws`,
# so the fuzz workspace can drive the same law collection the in-tree proptests
# assert. Test/fuzz-only.
laws = []
# Counts big-integer limb-scale work (operand limbs per `Base` operation:
# arithmetic, comparison, equality, and hashing; plus one value-width record per
# decoded wide-gamma value) into a process-global counter read via
# `before::meter`, and lights the accumulator's digit-touch counter
# (`suanpan/touch-meter`, read via `suanpan::touch_meter`) beside it.
# Arithmetic-width blowups are invisible to node-count and heap meters; this one
# sees them. Additive and off by default: it adds one relaxed atomic bump per
# `Base` operation, so it stays out of the bench builds (deliberately not in the
# self-dev-dependency above) and is lit by `--all-features` runs and the
# metering envelopes that assert it.
limb-meter = ["meter", "suanpan/touch-meter"]
# Counts packed-stream bits scanned and written (id tag reads and skip steps,
# id-builder bit writes and splice lengths, event topology cursor advances and
# gamma code-skips, every validator/decoder bit cursor) into a process-global
# counter read via `before::meter`. Traversal work over the packed forms is
# invisible to the heap, segment, and limb meters when it allocates nothing,
# recurses nothing, and does no `Base` arithmetic — the id-side walks are
# exactly that — so this is the column that sees it. Additive and off by
# default, in the `limb-meter` idiom: one relaxed atomic bump per primitive, out
# of the bench builds, lit by `--all-features` runs and the metering suites that
# assert it.
scan-meter = ["meter"]

[lints.rust]
# The allocation-strategy bench (`benches/presize.rs`) compiles alternative
# arms into library sites through this cfg, one value per site arm; each
# seam's comment names its site. RUSTFLAGS-only by design — registering it
# here guarantees no cargo feature can ever select an arm, and `deny` fails
# the build of any seam or bench that queries an arm missing from this
# roster, so the roster cannot drift from the code. (It cannot see a
# mistyped RUSTFLAGS value nothing queries; the `bench-alloc-ab` recipe
# validates the arm name at invocation for exactly that hole.)
unexpected_cfgs = { level = "deny", check-cfg = [
    'cfg(before_alloc_ab, values("projection_growth", "projection_shrink", "display_growth"))',
] }

# The board example judges limb, scan, and touch work against pinned
# floors and ceilings; built without the counter features those columns
# read `off` and every one of their verdicts silently renders green.
# Requiring the features makes the unfeatured invocation a loud cargo
# error instead of a board that looks judged and isn't.
[[example]]
name = "amp_board"
required-features = ["limb-meter", "scan-meter"]

# The integer-code corpus study walks the board's shape bundles, which live
# behind the meter surface. Measure-only: it re-parses stored streams and
# prices candidate codes closed-form on the histograms; it reads no
# counters, so the base `meter` feature is enough.
[[example]]
name = "code_study"
required-features = ["meter"]

[[bench]]
name = "party"
harness = false

[[bench]]
name = "version"
harness = false

[[bench]]
name = "clock"
harness = false

[[bench]]
name = "amplify"
harness = false

[[bench]]
name = "board"
harness = false

[[bench]]
name = "tripwire"
harness = false

[[bench]]
name = "presize"
harness = false
