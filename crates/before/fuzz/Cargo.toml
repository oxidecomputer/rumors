# The empty workspace table keeps libFuzzer's dependencies out of the main
# workspace. The repository justfile owns the build and run commands.
[workspace]

[package]
name = "before-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# Allocation growth guard shared by the target entry points.
peak_alloc = "0.3"
# Transport implementations compared by the differential target.
borsh = "1"
postcard = { version = "1", default-features = false, features = ["use-std"] }
serde = "1"

[dependencies.before]
path = ".."
# The law and transport targets exercise these feature-gated public surfaces.
features = ["laws", "serde", "borsh"]

# The package library owns the deterministic target bodies. Unit tests replay
# every committed seed through them; the binaries only connect libFuzzer.

# High-throughput canonical decoding, independent of transport framing.
[[bin]]
name = "fuzz_decode"
path = "fuzz_targets/fuzz_decode.rs"
test = false
doc = false
bench = false

# Fused, composed, and transport decoders must agree.
[[bin]]
name = "fuzz_decode_differential"
path = "fuzz_targets/fuzz_decode_differential.rs"
test = false
doc = false
bench = false

# Stateful operations over an arbitrarily decoded clock.
[[bin]]
name = "fuzz_decode_ops"
path = "fuzz_targets/fuzz_decode_ops.rs"
test = false
doc = false
bench = false

# The shared algebraic laws over arbitrarily decoded values.
[[bin]]
name = "fuzz_laws"
path = "fuzz_targets/fuzz_laws.rs"
test = false
doc = false
bench = false
