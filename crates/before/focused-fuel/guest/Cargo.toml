[package]
name = "focused-fuel-guest"
version = "0.0.0"
publish = false
edition = "2021"

# A cdylib so `cargo build --target wasm32-unknown-unknown` emits a plain wasm
# module whose exports the harness calls directly.
# No tests or doctests: the fuel import has a definition only inside a
# Wasmtime host, so a native test binary of this crate cannot link.
[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
# `meter` exposes the committed adversarial generators the probes build their
# operands from, and the entry points that bypass public shortcuts.
before = { workspace = true, features = ["meter"] }
focused-fuel-protocol.workspace = true
# Exact closed forms the probes check family answers against.
num-bigint.workspace = true
# The heaps behind the guest's global allocator, the fuel board's window
# allocator (see `src/lib.rs`).
dlmalloc.workspace = true
# The lock around those heaps.
spin.workspace = true
