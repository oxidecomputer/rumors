[package]
name = "wasm32-pins-protocol"
version = "0.0.0"
publish = false
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
# Derives each protocol enum's decoder from its declared numbers, so a decoder
# cannot disagree with the numbering it inverts. Tool-side only: this crate is
# outside the workspace's default members.
strum_macros.workspace = true
