# Standalone 32-bit boundary-pin workspace. The empty `[workspace]` table
# detaches it from the parent `rumors` workspace, so the ordinary gate never
# builds it (the harness carries wasmtime, a heavy tool-side dependency that
# must stay out of the production crates' graph; the guest builds only for
# wasm32-unknown-unknown). Build/run through the `just wasm32-pins*` recipes.
#
# Why this exists: `just wasm-check` only proves `before` *compiles* for a
# 32-bit target; nothing in the tree *executes* there, so a 32-bit-only
# arithmetic seam (a `usize` wrap, a pointer-width-capped dependency limit)
# can pass every native suite while decoding wrongly on wasm32. This
# workspace is the execution leg: the guest drives `before`'s public byte
# decode doors at the exact sizes where 32-bit position arithmetic has
# boundaries, and the harness pins each boundary's behavior — red first
# (the trap or wrong value as found), then green when the seam is engineered
# around.
#
# Two members:
#   guest    the wasm kernel: boundary-size decode cases over `before`'s
#            public surface, compiled to wasm32-unknown-unknown and executed
#            under wasmtime with a full 4 GiB 32-bit address space
#   harness  the native side: the wasmtime driver plus the pin tests
[workspace]
members = ["guest", "harness"]
resolver = "2"

# Run the arithmetic users get in an ordinary release build. Explicit
# boundary checks must prevent wraps; compiler-added overflow traps would
# conceal the wrong-value failures this workspace exists to catch.
[profile.release]
overflow-checks = false
