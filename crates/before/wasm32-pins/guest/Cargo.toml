[package]
name = "wasm32-pins-guest"
version = "0.0.0"
publish = false
edition = "2021"

# A cdylib makes the single typed check function directly callable by wasmtime.
# Inputs are synthesized inside the guest, so no bulk data crosses the host
# boundary and all size arithmetic uses wasm32's `usize`.
[lib]
crate-type = ["cdylib"]

[dependencies]
# The meter feature exposes exact live bit lengths, which distinguish crossing
# a bit-position boundary from merely allocating a buffer of nearby size. The
# borsh feature adds the stream decoders, whose bit cursor is separate from
# the slice decoder's.
before = { workspace = true, features = ["meter", "borsh"] }
# Names `BorshDeserialize`, which `before` implements but does not re-export.
borsh.workspace = true
suanpan.workspace = true
wasm32-pins-protocol.workspace = true
