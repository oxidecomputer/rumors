# The surface-totality checker: a tool-side member of the root workspace,
# outside its default members, so the gate's ordinary legs never compile it (the rustdoc-JSON schema tooling stays out of the production
# crates' builds); the gate reaches it through the `just surface-totality`
# recipe alone, which documents the check and the toolchain-bump procedure.

[package]
name = "surfacecheck"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# The `meter` feature exposes the board inventory, which this check reconciles
# with rustdoc's compiler-derived surface.
before = { workspace = true, features = ["meter"] }
# The rustdoc JSON schema; the root manifest's entry explains its exact pin.
rustdoc-types.workspace = true
serde_json.workspace = true
