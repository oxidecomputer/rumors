[package]
name = "fuzzfit-guest"
version = "0.0.0"
publish = false
edition = "2021"

# A cdylib so `cargo build --target wasm32-unknown-unknown` emits a plain wasm
# module (no wasm-bindgen: the ABI is hand-written u32/i32 exports over linear
# memory, which is what keeps the fuel measurement free of glue-code noise).
[lib]
crate-type = ["cdylib"]

[dependencies]
before = { path = "../.." }
