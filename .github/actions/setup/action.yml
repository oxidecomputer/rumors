name: Set up verification
description: Install the repository's pinned toolchains and the tools a CI job names.

inputs:
  tools:
    description: Comma-separated tools for taiki-e/install-action.
    required: true
  nightly:
    description: Whether to install the nightly pinned by the justfile.
    required: false
    default: "false"
  stable-components:
    description: Extra components beyond rust-toolchain.toml for this job.
    required: false
    default: ""
  nightly-components:
    description: Comma-separated components to add to the pinned nightly.
    required: false
    default: ""
  node:
    description: Whether to install Node and enable the visualizer's npm cache.
    required: false
    default: "false"
  cache-workspaces:
    description: Workspace roots for Swatinem/rust-cache.
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Install command-line tools
      uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
      with:
        tool: ${{ inputs.tools }}

    # Read the complete declaration rather than copying its channel, components,
    # and targets into every workflow job.
    - name: Read the stable toolchain declaration
      id: stable
      shell: bash
      env:
        EXTRA_COMPONENTS: ${{ inputs.stable-components }}
      run: |
        python3 - <<'PY' >> "$GITHUB_OUTPUT"
        import os
        import tomllib

        with open("rust-toolchain.toml", "rb") as source:
            toolchain = tomllib.load(source)["toolchain"]
        components = list(toolchain.get("components", ()))
        components.extend(filter(None, os.environ["EXTRA_COMPONENTS"].split(",")))
        print(f"channel={toolchain['channel']}")
        print(f"components={','.join(dict.fromkeys(components))}")
        print(f"targets={','.join(toolchain.get('targets', ()))}")
        PY

    - name: Install the pinned stable toolchain
      uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
      with:
        toolchain: ${{ steps.stable.outputs.channel }}
        components: ${{ steps.stable.outputs.components }}
        targets: ${{ steps.stable.outputs.targets }}

    - name: Read the nightly pin
      if: inputs.nightly == 'true'
      id: nightly
      shell: bash
      run: |
        channel=$(just --evaluate nightly_toolchain)
        if [ -z "$channel" ]; then
          echo "nightly pin not found in the justfile" >&2
          exit 1
        fi
        echo "channel=$channel" >> "$GITHUB_OUTPUT"

    - name: Install the pinned nightly toolchain
      if: inputs.nightly == 'true'
      uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
      with:
        toolchain: ${{ steps.nightly.outputs.channel }}
        components: ${{ inputs.nightly-components }}

    - name: Install Node
      if: inputs.node == 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: crates/before-viz/www/package-lock.json

    - name: Cache Cargo build artifacts
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: ${{ inputs.cache-workspaces }}
