# Build the before-viz WASM visualizer and deploy it to GitHub Pages.
#
# The site is served from a project subpath (https://oxidecomputer.github.io/rumors/);
# every asset reference in index.html / the esbuild bundle is relative, so no base-href
# rewriting is needed. Only the minimal runtime set is published — not node_modules,
# not the TypeScript sources, not the wasm-pack glue that esbuild already inlined.
#
# Every action is pinned to a full commit SHA, with the tag it was resolved
# from in a trailing comment — no step executes code that is neither committed
# in-tree nor identified by an immutable digest (tools/workflowlint holds every
# workflow to this). Bump procedure: Dependabot rewrites each pin and its
# trailing comment together; .github/dependabot.yml is its configuration.
#
# One-time setup: repo Settings > Pages > Build and deployment > Source = "GitHub Actions".
name: Deploy before-viz to Pages

on:
  push:
    branches: [main]
    paths:
      - "crates/before-viz/**"
      - "crates/before/**" # the engine the visualizer compiles in
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Allow one concurrent deployment; don't cancel an in-progress one mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Permissions are per-job, least-privilege: the build job runs the most
  # third-party code (npm postinstalls, wasm tooling) and holds only checkout
  # rights, so nothing it executes can reach a deploy credential; the
  # pages/id-token pair lives in the deploy job alone, which runs no
  # third-party code beyond the pinned deploy action.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown

      # The same checksum-verifying install path ci.yml uses, so both
      # workflows share one provenance story for wasm-pack.
      - name: Install wasm-pack
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: wasm-pack

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/before-viz/www/package-lock.json

      - name: Build visualizer
        run: ./crates/before-viz/build.sh

      # Assemble the minimal runtime set: index.html + style.css + fonts + the esbuild
      # bundle + the wasm. The bundle inlines pkg/before_viz.js and resolves the wasm via
      # ../pkg/before_viz_bg.wasm, so that one .wasm is the only thing pkg/ contributes.
      - name: Assemble site
        working-directory: crates/before-viz/www
        run: |
          dest="$GITHUB_WORKSPACE/_site"
          mkdir -p "$dest/dist" "$dest/pkg"
          cp index.html style.css "$dest/"
          cp -R fonts "$dest/"
          cp dist/app.js "$dest/dist/"
          cp pkg/before_viz_bg.wasm "$dest/pkg/"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
