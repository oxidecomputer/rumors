# Build the before-viz WASM visualizer and deploy it to GitHub Pages.
#
# The site is served from a project subpath (https://oxidecomputer.github.io/rumors/);
# every asset reference in index.html / the esbuild bundle is relative, so no base-href
# rewriting is needed. Only the minimal runtime set is published — not node_modules,
# not the TypeScript sources, not the wasm-pack glue that esbuild already inlined.
#
# Actions are pinned to full commit SHAs with the source ref in a trailing
# comment (tools/workflowlint enforces the shape; .github/dependabot.yml
# carries the bump procedure).
#
# One-time setup: repo Settings > Pages > Build and deployment > Source = "GitHub Actions".
name: Deploy before-viz to Pages

on:
  push:
    branches: [main]
    paths:
      - "crates/before-viz/**"
      - "crates/before/**" # the engine the visualizer compiles in
      - ".github/actions/setup/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Allow one concurrent deployment; don't cancel an in-progress one mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Permissions are per-job, least-privilege: the build job runs the most
  # third-party code (npm postinstalls, wasm tooling) and holds only checkout
  # rights, so nothing it executes can reach a deploy credential; the
  # pages/id-token pair lives in the deploy job alone, which runs no
  # third-party code beyond the pinned deploy action.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Use the same pinned toolchain, tools, Node version, and npm cache as
      # the CI build of this artifact.
      - uses: ./.github/actions/setup
        with:
          tools: just,wasm-pack
          node: "true"

      - name: Build visualizer
        run: just viz

      # Assemble the minimal runtime set: index.html + style.css + fonts + the esbuild
      # bundle + the wasm. The bundle inlines pkg/before_viz.js and resolves the wasm via
      # ../pkg/before_viz_bg.wasm, so that one .wasm is the only thing pkg/ contributes.
      - name: Assemble site
        working-directory: crates/before-viz/www
        run: |
          dest="$GITHUB_WORKSPACE/_site"
          mkdir -p "$dest/dist" "$dest/pkg"
          cp index.html style.css "$dest/"
          cp -R fonts "$dest/"
          cp dist/app.js "$dest/dist/"
          cp pkg/before_viz_bg.wasm "$dest/pkg/"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
