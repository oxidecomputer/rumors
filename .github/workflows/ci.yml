# Run the CI verification groups on every push to main and every pull request.
#
# `ci` is the build-everything tier — lints, docs, the feature matrix, the
# full test and doctest run, bench compilation, fuzz-target verification, and
# the viz bundle;
# the justfile's `ci` recipe line is the roster of record, ordered
# cheap-first. It builds the fuzz targets but does not run the smoke (`just all`
# adds that locally — libFuzzer minutes are a poor per-commit spend). The
# `instruments` job beside it re-runs the gate judgments that belong on a
# shared runner: dependency policy, the board verdicts and pins, and surface
# totality. Its job comment says which instruments stay local and why. The
# `coverage` job runs the two instrumented-coverage legs against the
# curated kernel pin (the justfile's coverage section carries the design).
# The `properties` job runs Rumors in release at the larger case count pinned
# by `test-release` in the justfile.
# The justfile owns each job's roster. The workflow names only those groups,
# so adding or removing a check cannot leave a copied workflow list behind.
#
# Each job names only the tools and recipe group it needs. The local setup
# action installs the required toolchains from their in-tree pins, configures the
# shared caches, and provides Node where required.
#
# Actions are pinned to full commit SHAs with the source ref in a trailing
# comment (tools/workflowlint enforces the shape; .github/dependabot.yml
# carries the bump procedure).
name: ci

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch supersedes the sweep already running on it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # cargo-rdme is versioned because readme-check compares generated bytes.
      # The remaining tools produce verdicts rather than committed artifacts.
      - uses: ./.github/actions/setup
        with:
          tools: just,cargo-nextest,cargo-rdme@2.1.0,cargo-fuzz,cargo-docs-rs,wasm-pack
          nightly: "true"
          node: "true"
          cache-workspaces: |
            .
            crates/before/fuzz

      - name: just ci
        run: just ci

# Gate judgments that also run on shared runners: advisory and dependency
# policy, the amplification board and its ranking pin, and public-surface
# totality. The local gate additionally runs the detached Wasmtime fuel and
# 32-bit boundary suites; their builds and deep executions are deliberately
# kept off the shared runner.
  #
  # Runner fit: every step here builds `before` alone (release profile,
  # counter features) plus the small detached surfacecheck workspace;
  # rumors' release-profile bench builds live in `ci`'s bench-build leg,
  # not in this job.
  #
  # Toolchain coupling: surface-totality parses nightly rustdoc JSON
  # through a `rustdoc-types` pin matched to the pinned nightly's
  # format_version. The nightly is dated, so the format moves only when
  # the pin is bumped deliberately; the checker refuses a mismatch loudly,
  # naming both version numbers, and the justfile's surface-totality
  # comment documents the paired re-pin procedure.
  instruments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          tools: just,cargo-nextest,cargo-audit,cargo-deny
          nightly: "true"
          cache-workspaces: |
            .
            crates/before/surfacecheck

      - name: Run deterministic instruments
        run: just ci-instruments

  # The instrumented-coverage legs: kernel line coverage on stable and
  # kernel branch coverage on the pinned nightly, each held to the curated
  # pinned expectation (tools/covcheck-expected.json) by tools/covcheck —
  # tamper-evident in both directions, so a new uncovered kernel line or a
  # stale pin entry fails by name. The justfile's coverage section carries
  # the design and why these are sweep legs, never gate legs: each run is a
  # full instrumented rebuild plus the whole suite under instrumentation.
  #
  # Runner fit: both legs build the workspace test tier (debug profile,
  # instrumented) — the same shape as `ci`'s test-all leg, well inside the
  # runner's memory; the bench/release tier is never built here.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          tools: just,cargo-nextest,cargo-llvm-cov
          stable-components: llvm-tools
          nightly: "true"
          nightly-components: llvm-tools

      - name: Run pinned kernel coverage
        run: just ci-coverage

  # More randomized Rumors coverage than the commit gate can afford. Release
  # keeps each case cheap; the justfile owns the count and timeout profile.
  properties:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          tools: just,cargo-nextest

      - name: Run high-count Rumors properties
        run: just ci-properties
