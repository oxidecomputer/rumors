# cargo-mutants configuration: the campaign configuration of record
# (the executable keys above `exclude_re`) and the exclusion roster of
# proven-equivalent and performance-genre mutants.
#
# Every entry is a mutant that survives the suites under the campaign
# configuration of record for a reason that is not a test gap: either
# the mutation is provably value-equivalent (its discriminating input
# class is empty), or it moves only work — routing between extensionally
# equal paths inside the meters' deliberate headroom band. Killing a
# work-only mutant through the meter suite would derive thresholds from
# mutants, converting deliberate slack into an implementation pin; such
# mutants are excluded here instead, each with its genre and the proof
# or rationale of record.
#
# Standing policy: an exclusion is never added to make a campaign green.
# Before any entry, the disposition ladder runs the other way: (1)
# refactor, so the mutated codepoint does not structurally exist (the
# precise operation instead of a bare operator, a stronger type, a
# dissolved dead arm); (2) where a branch is truly unreachable but must
# structurally exist, make it assert the impossibility at the site — an
# asserted branch kills its own guard mutants, so it needs no entry
# here; (3) only what neither disposition dissolves may be excluded,
# with the equivalence or work-only argument stated per replacement
# operator and naming every leg the pattern suppresses.
#
# Campaign configuration of record — the keys below make the plain
# invocation (`cargo mutants --workspace`) run it: nextest, all
# features, the whole workspace's suites, under cargo's default
# dev/test profile. That is what the gate's test leg (`just test-all`)
# observes, so the roster promises exactly what the committed suites
# enforce: all features, because the instrument-killed dispositions in
# this header cite meter rows and tests/meter.rs builds only under the
# meter features; the dev/test profile, because overflow checks and
# debug assertions are part of the observer (an arithmetic guard may
# discharge by panicking on the inputs the suites drive). A release or
# default-features campaign is a weaker observer; its extra survivors
# are not roster material.
#
# Regex discipline: patterns match the names `cargo mutants --list`
# prints. Most entries avoid line numbers, anchoring on file, operator
# pattern, and function, so they survive line drift. Where the same
# operator pattern occurs twice in one function and only one occurrence is
# equivalent, the entry pins file:line:col; a pinned entry fails open on
# drift (the equivalent survivor reappears as MISSED — re-verify the site
# and re-pin), but before trusting a pinned entry after edits to its file,
# confirm the pinned line still names the intended expression.
#
# Deliberately absent: sweep::eq_exit's `||`-guard mutant and
# integral::meter_product's tap deletion. Their owning instruments kill
# them — the eq_exit early-exit row and the settle-products liveness
# floor in tests/meter.rs — so they need no exclusion. Likewise absent:
# the fill/pre-scan sub-scan routing guards in copy_range and
# scan_max_consuming, and masked.rs's block-skip pair, killed by the
# sub-scan hole and masked-hole engagement families' envelope rows; and
# charge_digits' span-subtraction mutants (both the `+` and `/`
# replacements size the densified images by something other than the
# cluster's span), killed by the densify tap's span pin
# (densify_tap_prices_the_cluster_span, the query fold's test suite)
# and the hoisted-window densify band in tests/meter.rs. Also absent:
# the residue-dominates side of propagate's wide-hop guard machinery
# (its `>=` width guard and its `sign_dominates_at` clearance floor),
# killed by the propagate-seam bands (the plunge ceiling and clearance
# band trip on the rerouted hops, demonstrated by direct application);
# and the
# watermark pool-recycle deletions — MinWeb::retire replaced with ()
# and MinWeb::lease replaced with a bare Default::default() — killed by
# the pool-miss row (the seam-stop pool row in tests/meter.rs: a dead
# recycle reads misses proportional to churn against a derived
# peak-demand ceiling, and a bypassed lease reads zero against the
# fill-phase liveness floor). Also absent: MinWeb::compacting's
# delete-field mutant (the min-ticks web built without inline-word
# compaction), killed by the boundary-stacking row (the
# skyline_min_ticks_ascend envelope in tests/meter.rs, over both its
# peak-heap and touch ceilings; the compacting doc carries the
# measured margins) — and unexcludable regardless, since cargo-mutants
# 27.1.0 applies name filters to no delete-field mutant.

test_tool = "nextest"
test_workspace = true
additional_cargo_args = ["--all-features"]

exclude_re = [
    # --- suanpan::accumulator ---

    # Proven equivalent: read_digits' final carry has magnitude at
    # most 3 (bound derived in the comment at the site), so each high-part
    # drain emits its whole value in its first digit and the mutated shift
    # direction has an empty discriminating class.
    "accumulator\\.rs.*: replace >>= with <<= in Accumulator::read_digits",

    # Performance genre, owner-declared benign fast path: the identity
    # guard routes cost and representation only (the comment at the site
    # carries the argument), and no honest meter band can price a zero
    # shift without pinning the representation.
    "accumulator\\.rs.*: replace \\|\\| with && in Accumulator::shl",

    # --- before::version::skyline::watermark ---

    # Performance genre, one leg, line-pinned: propagate's
    # dwarf-domination fast arms fold and retire exactly what the total
    # fold-then-sign path folds and retires, and the one surviving guard
    # mutant routes only work. Both arms read domination through
    # `sign_dominates_at` certificates matched as tuples (a wrong-sign
    # certificate panics), so no boolean or sign operator is left for
    # the tool to mutate; the mutable surface is the width guards, and
    # the pinned leg is the boundary-dominates arm's strictness (`>=`
    # loosened to `<` inverts the guard): it routes that arm's hops onto
    # the comparable-scale fold, which is touch-identical on that arm
    # (the seam-stop band's readings are byte-equal under the swap). The
    # residue-dominates arm's same-shaped mutant is killed — the
    # ascending-cliff cascade band prices its total death and the
    # propagate-seam bands price its clearance line — and both arms'
    # `+ 2` clearance arithmetic faces the suite (the `- 2` mutants
    # underflow and panic on the word-scale one-digit accumulators the
    # committed suites drive through every hop, under the profile of
    # record's overflow checks), so none of those carries an exclusion.
    "watermark\\.rs:790:43: replace >= with < in MinWeb<P>::propagate",

    # Performance genre, both floor sites, either replacement: the
    # undercut decision's scale probes read domination at a floor index,
    # and each leg (`-` to `+`, `-` to `/`) only shifts that floor — a
    # shifted floor changes which side of the fast/total split answers,
    # not the answer, verified value-equivalent under mutation with all
    # meters lit.
    "watermark\\.rs.*: replace - with (\\+|/) in MinWeb<P>::decide_undercut_through_latent",

    # Performance genre: an unarmed range's gap is re-based on arming, so
    # folding height into it early is a dead store.
    "watermark\\.rs.*: replace > with >= in MinWeb<P>::fold_height",

    # --- before::version::skyline::grow ---

    # Proven equivalent: at a width tie of at most one bit, both magnitudes
    # are the unique value of that width, so the comparison the widened
    # guard routes through returns false exactly as the width cutoff
    # decides — a work guard with an empty discriminating class.
    "grow\\.rs.*: replace > with >= in recode",

    # Proven equivalent, line-pinned (the match arm's guard shares the
    # operator pattern and is killed): at equal magnitude the cross and
    # shrink paths both land on the positive zero zigzag.
    "grow\\.rs:463:38: replace < with <= in recode",

    # --- before::version::skyline::fill / prescan ---

    # Performance genre, line-pinned (record's completeness guard above it
    # shares the operator pattern and is killed): level 0 never defers a
    # first-child link, so its keeper is never read and the keeper fold is
    # skippable work.
    "prescan\\.rs:337:26: replace > with >= in PreScan<'a, 'm>::record",

    # Performance genre: the collapse skip's routing boundary moves only
    # work between extensionally equal paths, and both sides fold the
    # identical net movement exactly once per leaf — per-leaf into the
    # web's height side or the dying entry net (exactly one of the two is
    # live at any step), the block side into one materialized net folded
    # in once at the close — so the reroute is touch-neutral on deep and
    # leaf-scale ranges alike and no honest band can separate it. The
    # tick_site_hole envelope prices the block fold itself (net-only, no
    # streamed extremum); this entry covers only which side of the depth
    # boundary answers — every leg of the alternation (`<=`, `==`, `>`)
    # only re-draws that boundary, so the argument covers each uniformly.
    "prescan\\.rs.*: replace < with (<=|==|>) in PreScan<'a, 'm>::skip_collapse",

    # Performance genre: both sides of the max scan's routing boundary
    # fold the identical net movement and extremum per leaf, so the
    # reroute is touch-neutral on deep and leaf-scale ranges alike and no
    # honest band can separate it — every leg of the alternation (`<=`,
    # `==`, `>`) only re-draws the boundary, covered uniformly.
    "prescan\\.rs.*: replace < with (<=|==|>) in PreScan<'a, 'm>::max_range",

    # --- before::version::skyline::query::integral ---

    # Performance genre, the freeze trigger's strictness leg only: `>=`
    # engages the freeze one digit inside the allowance, and the verdicts
    # and settled values are identical on either side — the freeze moves
    # where drift waits, never what settles. The other legs face the
    # suite: a trigger inverted (`<`) or demanding exact equality (`==`)
    # skips freezing wide drift outright, and the adequacy tripwires and
    # meter bands read the un-frozen sweeps superlinear.
    "integral\\.rs.*: replace > with >= in Integrator::boundary",

    # Performance genre, the allowance-scaling leg only: `funded *
    # FREEZE_ALLOWANCE_DIGITS` moves the freeze engagement inside the
    # deliberate allowance (later on wide funding, one digit earlier at
    # word scale), verdicts and settled values identical. The `-` leg
    # faces the suite: it underflows at word-scale funding and panics
    # under the profile of record's overflow checks.
    "integral\\.rs.*: replace \\+ with \\* in Integrator::boundary",

    # Performance genre, the promote trigger's strictness leg only: `>=`
    # promotes the parked component into the ledger one digit inside the
    # allowance, and promotion timing at that margin is value-neutral —
    # the close-out settle charges the same double sum wherever the
    # split lands — so the leg only routes park/settle work. Every other
    # mutation of this trigger starves or inverts promotion outright and
    # faces the suite: the adequacy tripwires read a promote-starved
    # sweep's settles superlinear (`==`, and the allowance arithmetic's
    # `*` scaling), the hoisted-window flatness band prices the
    # inversion (`<`), and the allowance's `-` leg underflows and panics
    # under the profile of record's overflow checks.
    "integral\\.rs.*: replace > with >= in Integrator::freeze",

    # Performance genre: the settled value is independent of the arming
    # tree's shape, so the shape-tuning sum routes only work.
    "integral\\.rs.*: replace \\+ with \\* in Integrator::settle_armings",

    # --- rumors::tree::mirror::cbor ---

    # Proven equivalent, every write_head site: `major` arrives pre-shifted
    # into bits 5 through 7 (the function's debug_assert holds the unshifted
    # value below 8), and every right operand is below 32 (`value as u8` in
    # the immediate arm is at most 23; the other arms' literals are 24
    # through 27), so the operands are bit-disjoint and `|` equals `^` for
    # all inputs. The `&` legs face the suite: a masked head byte breaks the
    # wire's round-trips.
    "cbor\\.rs.*: replace \\| with \\^ in write_head",

    # --- rumors::bookmark::format ---

    # Proven equivalent, every push_head site: the same disjointness as
    # write_head above (`major` is one of the pre-shifted MAJOR_* constants,
    # occupying bits 5 through 7; every right operand is below 32). The `^`
    # legs only; the `&` legs face the suite through the wide-head
    # round-trip and wide-version tests.
    "format\\.rs.*: replace \\| with \\^ in push_head",

    # --- rumors::tree::mirror::handshake ---

    # Proven equivalent, line-pinned (a const item, so the name carries no
    # function anchor): PREAMBLE_MAX is a hand-rolled const max, and `>`
    # versus `>=` differ only at a tie, where both arms return the same
    # value — for any operands, not merely the current constants. Stable
    # 1.97 has no const `usize::max` to delegate the comparison to.
    "handshake\\.rs:88:24: replace > with >=",

    # Proven equivalent on all admitted inputs, line-pinned, both legs: the
    # defensive width guard before the network split is unreachable —
    # canonical shortest-form heads pin the version and network items to one
    # byte each, so a decode that reaches the guard always holds exactly 17
    # of the fixed item's 30 bytes — and each replacement (`==`, `<=`) fires
    # only at input.len() == NETWORK_LEN, a state no admitted input reaches.
    # The guard stays a graceful error rather than an assert: the
    # defensive-variant exemption in handshake/tests.rs records that design,
    # and `PreambleDefect::NetworkTruncated` is public API. The inverted leg
    # (`>`) fires on every input and faces the suite.
    "handshake\\.rs:257:24: replace < with (==|<=) in Preamble::decode_v2",

    # --- rumors::peer ---

    # Performance genre: warm_caches is a doc(hidden) calibration aid that
    # forces the tree's lazy structural memos ahead of a timed operation.
    # Deleting the delegation moves only when the memos compute (the first
    # subsequent read instead of the call), value-identical on every path;
    # pricing that timing would pin the laziness policy itself.
    "peer\\.rs.*: replace Peer<T, B>::warm_caches with \\(\\)",
]
