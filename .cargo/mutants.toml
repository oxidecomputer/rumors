# cargo-mutants configuration: the exclusion roster of proven-equivalent
# and performance-genre mutants.
#
# Every entry is a mutant that survives the before+suanpan suites for a
# reason that is not a test gap: either the mutation is provably
# value-equivalent (its discriminating input class is empty), or it moves
# only work — routing between extensionally equal paths inside the meters'
# deliberate headroom band. Killing a work-only mutant through the meter
# suite would derive thresholds from mutants, converting deliberate slack
# into an implementation pin; such mutants are excluded here instead, each
# with its genre and the proof or rationale of record.
#
# Regex discipline: patterns match the names `cargo mutants --list`
# prints. Most entries avoid line numbers, anchoring on file, operator
# pattern, and function, so they survive line drift. Where the same
# operator pattern occurs twice in one function and only one occurrence is
# equivalent, the entry pins file:line:col; a pinned entry fails open on
# drift (the equivalent survivor reappears as MISSED — re-verify the site
# and re-pin), but before trusting a pinned entry after edits to its file,
# confirm the pinned line still names the intended expression.
#
# Deliberately absent: sweep::eq_exit's `||`-guard mutant and
# integral::meter_product's tap deletion. Their owning instruments kill
# them — the eq_exit early-exit row and the settle-products liveness
# floor in tests/meter.rs — so they need no exclusion. Likewise absent:
# the fill/pre-scan sub-scan routing guards in copy_range and
# scan_max_consuming, and masked.rs's block-skip pair, killed by the
# sub-scan hole and masked-hole engagement families' envelope rows; and
# charge_digits' span-subtraction mutants (both the `+` and `/`
# replacements size the densified images by something other than the
# cluster's span), killed by the densify tap's span pin
# (densify_tap_prices_the_cluster_span, the query fold's test suite)
# and the hoisted-window densify band in tests/meter.rs. Also absent:
# the residue-dominates side of propagate's wide-hop guard machinery
# (its `>=` guard, its `==` sign test, and — should the tool visit
# call-argument operators — its `sign_dominates_at` floor), killed by
# the propagate-seam bands (the plunge ceiling and clearance band trip
# on the rerouted hops, demonstrated by direct application); and the
# watermark pool-recycle deletions — MinWeb::retire replaced with ()
# and MinWeb::lease replaced with a bare Default::default() — killed by
# the pool-miss row (the seam-stop pool row in tests/meter.rs: a dead
# recycle reads misses proportional to churn against a derived
# peak-demand ceiling, and a bypassed lease reads zero against the
# fill-phase liveness floor).

exclude_re = [
    # --- suanpan::accumulator ---

    # Proven equivalent: read_magnitude's final carry has magnitude at
    # most 3 (bound derived in the comment at the site), so each high-part
    # drain emits its whole value in its first digit and the mutated shift
    # direction has an empty discriminating class.
    "accumulator\\.rs.*: replace >>= with <<= in Accumulator::read_magnitude",

    # Proven equivalent: at value 0 the digit loop never runs, so the sign
    # flag the boundary feeds is unread.
    "accumulator\\.rs.*: replace < with <= in Accumulator::deposit_value",

    # Performance genre, owner-declared benign fast path: the identity
    # guard routes cost and representation only (the comment at the site
    # carries the argument), and no honest meter band can price a zero
    # shift without pinning the representation.
    "accumulator\\.rs.*: replace \\|\\| with && in Accumulator::shl",

    # --- before::version::skyline::watermark ---

    # Performance genre: propagate's dwarf-domination fast arms fold and
    # retire exactly what the total fold-then-sign path folds and retires,
    # and the surviving guard mutants route only work. An eager width
    # guard (either arm's `+ 2` clearance test loosened to `- 2`) spends
    # a wasted domination read on hops whose certificate then honestly
    # refuses; the boundary-dominates arm's guard and sign mutants
    # (line-pinned below) route its hops onto the comparable-scale fold,
    # which is touch-identical on that arm (the seam-stop band's readings
    # are byte-equal under the swap). The residue-dominates arm's
    # same-shaped mutants are killed — the ascending-cliff cascade band
    # prices its total death and the propagate-seam bands price its
    # clearance line — so they carry no exclusion (the header's
    # deliberately-absent roster).
    "watermark\\.rs.*: replace \\+ with - in MinWeb<P>::propagate",
    "watermark\\.rs.*: replace && with \\|\\| in MinWeb<P>::propagate",
    "watermark\\.rs:773:43: replace >= with < in MinWeb<P>::propagate",
    "watermark\\.rs:779:44: replace == with != in MinWeb<P>::propagate",

    # Performance genre: the undercut decision's scale probes read
    # domination at a floor index; a shifted floor changes which side of
    # the fast/total split answers, not the answer, verified
    # value-equivalent under mutation with all meters lit.
    "watermark\\.rs.*: replace - with (\\+|/) in MinWeb<P>::decide_undercut_through_latent",

    # Performance genre: an unarmed range's gap is re-based on arming, so
    # folding height into it early is a dead store.
    "watermark\\.rs.*: replace > with >= in MinWeb<P>::fold_height",

    # Performance genre: compact_words selects the inline-word boundary
    # representation; the heap fallback is value-identical, and the
    # min-ticks envelope rows bound its cost.
    #
    # Known tool gap: cargo-mutants 27.1.0 never applies name filters to
    # delete-field mutants (visit_expr_struct pushes them past
    # allows_mutant), so this entry is presently inert and the compacting
    # survivor still lists as MISSED. The pattern matches the printed name
    # and engages when the filter gap closes upstream.
    "watermark\\.rs.*: delete field compact_words from struct MinWeb expression in MinWeb<P>::compacting",

    # --- before::version::skyline::grow ---

    # Proven equivalent: at a width tie of at most one bit, both magnitudes
    # are the unique value of that width, so the comparison the widened
    # guard routes through returns false exactly as the width cutoff
    # decides — a work guard with an empty discriminating class.
    "grow\\.rs.*: replace > with >= in recode",

    # Proven equivalent, line-pinned (the match arm's guard shares the
    # operator pattern and is killed): at equal magnitude the cross and
    # shrink paths both land on the positive zero zigzag.
    "grow\\.rs:457:38: replace < with <= in recode",

    # --- before::version::skyline::fill / prescan ---

    # Performance genre, line-pinned (record's completeness guard above it
    # shares the operator pattern and is killed): level 0 never defers a
    # first-child link, so its keeper is never read and the keeper fold is
    # skippable work.
    "prescan\\.rs:320:26: replace > with >= in PreScan<'a, 'm>::record",

    # Performance genre: the collapse skip's routing boundary moves only
    # work between extensionally equal paths, and both sides fold the
    # identical net movement exactly once per leaf — per-leaf into the
    # web's height side or the dying entry net (exactly one of the two is
    # live at any step), the block side into one materialized net folded
    # in once at the close — so the reroute is touch-neutral on deep and
    # leaf-scale ranges alike and no honest band can separate it. The
    # tick_site_hole envelope prices the block fold itself (net-only, no
    # streamed extremum); this entry covers only which side of the depth
    # boundary answers.
    "prescan\\.rs.*: replace < with (<=|==|>) in PreScan<'a, 'm>::skip_collapse",

    # Performance genre: both sides of the max scan's routing boundary
    # fold the identical net movement and extremum per leaf, so the
    # reroute is touch-neutral on deep and leaf-scale ranges alike and no
    # honest band can separate it.
    "prescan\\.rs.*: replace < with (<=|==|>) in PreScan<'a, 'm>::max_range",

    # --- before::version::skyline::query::integral ---

    # Proven equivalent: charge_digits' degenerate guards are value-inert
    # (the disjunction's arms coincide wherever they disagree in shape).
    "integral\\.rs.*: replace \\|\\| with && in charge_digits",

    # Proven equivalent: window digit counts are nonzero by construction,
    # so the strictness of the comparisons against them never
    # discriminates (both `<` sites in the function).
    "integral\\.rs.*: replace < with (<=|==|>) in charge_digits",

    # Proven equivalent: the jump coefficient is never zero, so the
    # comparison's strictness never discriminates (the contract at the
    # site carries the argument).
    "integral\\.rs.*: replace < with (<=|==|>) in Integrator::jump",

    # Performance genre: the boundary and freeze triggers tune engagement
    # thresholds inside the deliberate cost allowance; the verdicts and
    # settled values are identical on either side.
    "integral\\.rs.*: replace > with (==|<|>=) in Integrator::boundary",
    "integral\\.rs.*: replace \\+ with (-|\\*) in Integrator::boundary",
    "integral\\.rs.*: replace > with (==|<|>=) in Integrator::freeze",

    # Performance genre: the settled value is independent of the arming
    # tree's shape, so the shape-tuning sum routes only work.
    "integral\\.rs.*: replace \\+ with \\* in Integrator::settle_armings",
]
