# Liveness regressions must fail CI, not hang it. The protocol suites run
# under a closed-world deterministic poller (`run_to_quiescence`), which
# turns a reintroduced wire stall into a stalled-future error. A stall that
# escapes that harness (a real-executor integration test, a proptest whose
# case never completes) would otherwise hang the run forever, so nextest
# flags every test as slow after one 60-second period and terminates it
# after five, at 300 seconds.
#
# Two Rumors tests set that limit: the codec's
# `bounded_corpus_manifest_snapshot` and `dispute_wire`'s
# `table_corpus_has_similar_protocol_overhead`. Both pass, but on a machine
# shared by several concurrent builds and test runs either can take longer
# than three periods. A longer limit stretches every hang by the same
# amount, since a test that never finishes holds its slot until the limit
# before it fails; we accept that cost so these two tests can finish under
# load. Once they are cheaper, the limit can return to three periods.
#
# Nextest reads configuration only at the root of the workspace it runs in,
# so this file governs every member, the tool-side ones included; a
# `.config/nextest.toml` inside a member's directory is never read. A
# package with slower tests gets a per-package override below, with the
# same period and a limit no lower than this one: about twice its slowest
# passing run under heavy load, rounded up to a whole period, so a busy
# machine does not kill passing tests. The commit that sets such a limit
# records the readings; re-derive it when the tests' work grows.
#
# The limit also bounds proptest shrinking. Proptest persists a failing
# case's regression seed only after shrinking completes, so a failing
# property whose shrink phase outruns the limit is killed mid-shrink, and
# the reproducer is lost at exactly the moment it matters. Passing runs are
# unaffected. If a property fails on a loaded machine and dies here instead
# of reporting, rerun it with PROPTEST_MAX_SHRINK_ITERS lowered (or
# PROPTEST_MAX_SHRINK_TIME set, in milliseconds) so shrinking finishes
# inside the limit: the less-shrunk failing case still persists to
# proptest-regressions/ and reproduces deterministically. Lower the shrink
# budget rather than raising the limit, which would stretch every hang.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }

# The resource instruments run only through their justfile recipes, never in
# a plain nextest run: every tool-side member (a member that is not a
# default member, as the root Cargo.toml defines them) and the amplification
# board's smoke suite. They are the comparatively expensive tests, and the
# Wasmtime harnesses measure a guest that only their recipes build and name,
# so a bare `cargo nextest run --workspace` would fail them for want of the
# guest. Each recipe that runs one passes `--ignore-default-filter` and
# selects instruments alone. A recipe that forgot the flag would select no
# tests, which nextest reports as a failure; one that also selected ordinary
# tests would skip the instruments without failing, which is why no recipe
# mixes the two.
# `manifestlint` holds the `package(...)` terms to exactly the tool-side
# members, and so accepts only this spelling: `not (` and `)` around terms
# joined by `|`, each `package(NAME)` or `binary_id(PACKAGE::TEST)`.
default-filter = '''
not (
    package(before-fuelscape)
    | package(board-fuel-guest)
    | package(board-fuel-harness)
    | package(focused-fuel-guest)
    | package(focused-fuel-harness)
    | package(focused-fuel-protocol)
    | package(fuzzfit-guest)
    | package(fuzzfit-harness)
    | package(suanpan-fuel-guest)
    | package(suanpan-fuel-harness)
    | package(suanpan-fuel-protocol)
    | package(surfacecheck)
    | package(wasm32-pins-guest)
    | package(wasm32-pins-harness)
    | package(wasm32-pins-protocol)
    | binary_id(before::amp_board_smoke)
)
'''

# The 32-bit boundary pins walk inputs of hundreds of megabytes synthesized
# inside the guest. This limit is the only bound on a pin: the harness
# meters neither Wasmtime fuel nor epochs, so a guest loop that never exits
# runs until nextest kills it, and a hang in a fast pin also runs to the
# full limit.
[[profile.default.overrides]]
filter = 'package(wasm32-pins-harness)'
slow-timeout = { period = "60s", terminate-after = 20 }

# The fuelscape's slowest pin builds its exact counting tables twice, in
# parallel and sequentially, and compares them entry by entry.
[[profile.default.overrides]]
filter = 'package(before-fuelscape)'
slow-timeout = { period = "60s", terminate-after = 9 }

# Four thousand property cases make the slowest Rumors tests take several
# minutes in release. Ten minutes still turns a lost wakeup into a failure
# while leaving headroom over the measured five-to-six-minute maximum.
[profile.high-count]
slow-timeout = { period = "60s", terminate-after = 10 }

# The window measurement suites (window_knee, window_operator,
# window_corners, gossip_pipelining) need no scheduling isolation: their
# pins assert on exact virtual wire time (`benches/support/latency.rs`),
# which machine load cannot move, so they run interleaved with the rest
# of the suite like any other test. The one wall-clock upper bound among
# them (window_corners' real-clock promptness cross-check) holds a
# ~0.5 s measured catch-up under a 5 s budget: that ~8x headroom is what
# absorbs load there, where the virtual pins need none.
