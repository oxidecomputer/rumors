# Liveness regressions must fail CI, not hang it. The protocol suites run
# under a closed-world deterministic poller (`run_to_quiescence`), which
# turns a reintroduced wire stall into a stalled-future error — but a stall
# that escapes that harness (a real-executor integration test, a proptest
# whose case never completes) would otherwise hang the run forever.
#
# The slowest honest tests today are the proptest suites and the
# inter-process disruption tests, all finishing well under 60 seconds
# (the deterministic fixture search in src/tree/arb.rs is around 6
# seconds), so three 60-second periods —
# termination at 180 seconds — is generous headroom, and everything past
# the first period is flagged as slow in the meantime.
#
# One collision this budget knowingly accepts: proptest persists a failing
# case's regression seed only after shrinking completes, so a genuinely
# failing property whose shrink phase outruns the 180-second terminate
# budget is killed mid-shrink and the reproducer is lost at exactly the
# moment it matters. Passing runs are unaffected. If a property fails on a
# loaded machine and dies here instead of reporting, rerun it with
# PROPTEST_MAX_SHRINK_ITERS lowered (or PROPTEST_MAX_SHRINK_TIME set, in
# milliseconds) so shrinking finishes inside the budget: the less-shrunk
# failing case still persists to proptest-regressions/ and reproduces
# deterministically. Raising terminate-after instead would stretch every
# real hang by the same amount, which is the worse trade for CI.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 3 }

# The window measurement suites (window_knee, window_operator,
# window_corners, gossip_pipelining) need no scheduling isolation: their
# pins assert on exact virtual wire time (`benches/support/latency.rs`),
# which machine load cannot move, so they run interleaved with the rest
# of the suite like any other test. The one wall-clock upper bound among
# them (window_corners' real-clock promptness cross-check) holds a
# ~0.5 s measured catch-up under a 5 s budget: that ~8x headroom is what
# absorbs load there, where the virtual pins need none.

# The display canary (crates/before/tests/display_canary.rs) is the test
# suite's one deliberate wall-clock assertion: a rendering-time ratio whose
# ceiling separates num-bigint's divide-and-conquer complexity class from
# the quadratic one. The ratio's class margin (~1.4x on each side) assumes
# both measured intervals see a quiet machine: under a fully parallel
# workspace run, scheduler contention stretches the seconds-scale interval
# more than the milliseconds-scale one and inflates the ratio into the
# quadratic band (36x observed under gate load against ~19x quiet, dev
# profile, aarch64-apple-darwin). Reserving every runner thread makes the
# canary run alone, so the two intervals face the same conditions and the
# ceiling keeps measuring the complexity class, not the scheduler.
[[profile.default.overrides]]
filter = 'binary(display_canary)'
threads-required = "num-test-threads"

# The wall-exponent tripwire (before::meter::board::tests) is the board's
# one wall-clock assertion: an unmetered quadratic must read red on the
# judged time exponent while every counter column stays green. Its margin
# (~2.0 measured against the 1.3 ceiling) is wide, but both measured
# intervals should face the same quiet conditions for the fitted exponent
# to mean a complexity class; reserve the runner exactly as the display
# canary does.
[[profile.default.overrides]]
filter = 'test(unmetered_quadratic_reads_red_on_the_wall_exponent_leg)'
threads-required = "num-test-threads"
