# Configuration for the duplicate-dependency and license sweeps (`just
# supply-chain`, which runs `cargo deny check bans licenses`). Scope: the
# full feature-and-target closure of the root workspace's default members,
# development dependencies excluded; the tool-side members, every member
# that is not a default one, are excluded from the sweeps. Advisories are a
# separate check (`cargo audit`), which covers every version in every
# lockfile.

[graph]
all-features = true
# A development dependency never ships: a crate duplicated only among them
# compiles twice for tests alone, and its license binds no one who uses
# the published crates.
exclude-dev = true

# A crate resolved at two versions in what ships compiles twice and can
# carry two incompatible copies of one type through the public API. The
# sweep reports each duplicate as a warning, so it is visible, without
# blocking: converging usually waits on upstream releases. Whether a
# duplicated crate appears in the public API is a review question.
[bans]
multiple-versions = "warn"
skip = []

# Every crate that ships, the workspace's own included, must carry a license
# expression satisfiable from this list. The workspace's crates are licensed
# `MPL-2.0`, and cargo-deny checks their expressions alongside their
# dependencies', so `MPL-2.0` is listed for them; it admits a dependency
# under the same terms as well. The other entries are exactly the permissive
# licenses the shipped closure needs today, so a dependency that brings any
# other license fails the sweep until someone adds that license here
# deliberately. A choice inside an expression (`MIT OR LGPL-2.1-or-later`)
# is satisfied by any one allowed license.
[licenses]
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
]
